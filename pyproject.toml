[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-it"
dynamic = ["version"]
description = "Coordinate several people and AI agents working in parallel on one GitHub repository."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vincenzo" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    # typer 0.29 dropped Click; Forge builds on Click internals (ADR 0022).
    "typer>=0.12,<0.29",
    "pyyaml>=6.0",
    "rich>=13.7",
    "packaging>=24.0",
    # Windows has no system IANA time zone database for zoneinfo (PEP 615, ADR 0021).
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/dragonfly25/forge_it"

[project.scripts]
forge = "forge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.hatch.version]
path = "src/forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["forge"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["forge.core", "forge.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
