[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-it"
dynamic = ["version"]
description = "Coordinate several people and AI agents working in parallel on one GitHub repository."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Vincenzo" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
    "packaging>=24.0",
]

[project.urls]
Repository = "https://github.com/dragonfly25/forge_it"

[project.scripts]
forge = "forge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.hatch.version]
path = "src/forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["forge"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["forge.core", "forge.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
