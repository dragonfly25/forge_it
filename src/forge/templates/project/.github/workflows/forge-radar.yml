name: forge-radar

# Conflict radar and dependency refresh.
# On every push to the default branch: recompute task labels, unblock dependents,
# and comment on in-progress tasks whose zones were touched ("sync recommended").
# Every hour: flag stale leases the same way.
on:
  push:
    branches: ["{{default_branch}}"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: forge-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out (full history; Forge refuses shallow clones)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      # Optional secret FORGE_INSTALL_TOKEN: a read-only token for a private Forge repository.
      - name: Install Forge (pinned)
        env:
          FORGE_INSTALL_TOKEN: ${{ secrets.FORGE_INSTALL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${FORGE_INSTALL_TOKEN:-}" ]; then
            # git reads the credentials from env config: never from the URL or the command line.
            basic="$(printf 'x-access-token:%s' "$FORGE_INSTALL_TOKEN" | base64 | tr -d '\n')"
            echo "::add-mask::${basic}"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
          fi
          uv tool install "git+https://github.com/dragonfly25/forge_it@{{forge_install_ref}}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refresh labels and run the radar
        run: forge refresh --radar
